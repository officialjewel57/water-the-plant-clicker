<!-- Welcome to the mess that is this html file, it contains most of the things of the entire game. -->

<!DOCTYPE html>

<audio autoplay loop>
  <source src="water-the-plant-clicker/snd/drake-hotline-bling.mp3" type="audio/mpeg">
</audio>

<html>
  <head>
    <style>
      body {
        background-color: powderblue;
        font-family: "Trebuchet MS", sans-serif;
      }

      .mainPlant {
        background-color:dodgerblue;
        border-radius: 3px;
        border-color: cornflowerblue;
      }
    </style>
  </head>
  <body>
    <button id="mainPlant" class="mainPlant"><img src="https://cdn.discordapp.com/attachments/1548167542030340108/1548180844525387846/image.png?ex=6aa61f45&is=6aa4cdc5&hm=2f9436c0f0652ee76729c8c97f01999b556b0ce49763ec6d372f68bfc7fdcf9b&"></button>
    <button id="upgrade1">increase click power by 2x, price: <span id='upgrade1-price'>0</span></button>
    <h1>You have <span id="water-display">0</span> waters</h1>
    <h1>Water per click: <span id="waterPC">0</span></h1>
    
    <script>
      var waterAmount = 0;
      var waterPerClick = 1;
      var waterPerSec = 0;
      var upgrade1price = 100;
      const display = document.getElementById('water-display');
      const upgrade1DIS = document.getElementById('upgrade1-price')
      const waterButton = document.getElementById('mainPlant');
      const upgrade1 = document.getElementById('upgrade1');
      const waterPerC = document.getElementById('waterPC');
      const interval = setInterval(wps, 16.66666)

      function wps(){
        waterAmount = waterAmount + (waterPerSec / 60)
        upgrade1DIS.textContent = Math.floor(upgrade1price);
        waterPerC.textContent = Math.floor(waterPerClick);
        display.textContent = Math.floor(waterAmount);
      }

      waterButton.addEventListener('click', function(){
        waterAmount = waterAmount + waterPerClick;
      });

      upgrade1.addEventListener('click', function(){
        if(waterAmount >= upgrade1price){
          waterAmount-=upgrade1price;
          waterPerClick*=2;
          upgrade1price*=3.5;
        }
      });
    </script>
    
  </body>
</html>
